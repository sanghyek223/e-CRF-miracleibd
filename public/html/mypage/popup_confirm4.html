<!DOCTYPE html>
<html lang="ko">
<head>

<meta http-equiv="X-UA-Compatible" content="ie=edge">
<meta name="format-detection" content="telephone=no, address=no, email=no">
<meta name="mobile-web-app-capable" content="yes">
<title>Microbiome Registry</title>
<meta name="Author" content="The Korean Audiological Society">
<meta name="Keywords" content="Microbiome Registry 마이크로바이옴 레지스트리">
<meta name="description" content="Microbiome Registry 마이크로바이옴 레지스트리">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<link rel="stylesheet" href="/assets/css/common.css">

<script src="/assets/js/jquery-ui.min.js"></script>
<script src="/assets/js/common.js"></script>
</head>
<body>
    <div class="popup-wrap win-popup-wrap">
        <div class="popup-contents">
            <div class="popup-tit-wrap">
                <h3 class="popup-tit">데이터 신청 관리</h3>
            </div>
            <div class="popup-conbox">
                <form action="" method="">
                    <fieldset>
                        <legend class="hide">데이터 신청 관리</legend>

                        <h3 class="popup-sub-tit">신청 정보 확인</h3>
                        <div class="table-wrap nbd">
                            <table class="cst-table">
                                <caption class="hide">신청 정보</caption>
                                <colgroup>
                                    <col style="width: 25%;">
                                    <col>
                                    <col style="width: 25%;">
                                    <col>
                                </colgroup>
                                <tbody>
                                    <tr>
                                        <th scope="row">
                                            신청자
                                        </th>
                                        <td class="text-left">
                                            김OO (A기관)
                                        </td>
                                        <th scope="row">
                                            대상자 수
                                        </th>
                                        <td class="text-left">
                                            2건
                                        </td>
                                    </tr>
                                    <tr>
                                        <th scope="row">
                                            신청 사유
                                        </th>
                                        <td colspan="3" class="text-left">
                                            데이터 활용 목적
                                        </td>
                                    </tr>
                                    <tr>
                                        <th scope="row">
                                            신청일
                                        </th>
                                        <td colspan="3" class="text-left">
                                            2026-07-06 11:11:11
                                        </td>
                                    </tr>
                                    <tr>
                                        <th scope="row">
                                            처리 상태
                                        </th>
                                        <td colspan="3" class="text-left">
                                            <div class="radio-wrap">
                                                <div><label class="radio-group"><input type="radio" name="" id=""> 승인</label></div>
                                                <div><label class="radio-group"><input type="radio" name="" id=""> 반려</label></div>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                        <!--// 승인 선택 시 노출 -->
                        <h3 class="popup-sub-tit mt-20">다운로드 허용 기간 설정</h3>
                        <div class="table-wrap nbd">
                            <table class="cst-table">
                                <caption class="hide">다운로드 허용 기간 설정</caption>
                                <colgroup>
                                    <col style="width: 25%;">
                                    <col>
                                    <col style="width: 25%;">
                                    <col>
                                </colgroup>
                                <tbody>
                                    <tr>
                                        <th scope="row">
                                            시작 일자
                                        </th>
                                        <td colspan="3" class="text-left">
                                            
                                            <div class="form-group date">
                                                <input type="text" name="" id="" class="form-item line short text-center">
                                                <img src="/assets/image/icon/ic_cal.png" alt="">
                                            </div>
                                        </td>
                                    </tr>
                                    <tr>
                                        <th scope="row">
                                            종료 일자
                                        </th>
                                        <td colspan="3" class="text-left">
                                            
                                            <div class="form-group date">
                                                <input type="text" name="" id="" class="form-item line short text-center">
                                                <img src="/assets/image/icon/ic_cal.png" alt="">
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                        <!--// 반려 선택 시 노출 -->
                        <h3 class="popup-sub-tit mt-20">반려 사유 입력</h3>
                        <div class="table-wrap nbd">
                            <table class="cst-table">
                                <caption class="hide">반려 사유 입력</caption>
                                <colgroup>
                                    <col style="width: 25%;">
                                    <col>
                                    <col style="width: 25%;">
                                    <col>
                                </colgroup>
                                <tbody>
                                    <tr>
                                        <th scope="row">
                                            반려 사유
                                        </th>
                                        <td colspan="3" class="text-left">
                                            <textarea name="" id="" class="form-item"></textarea>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                        <div class="btn-wrap text-center">
                            <a href="#n" class="btn btn-type1 color-type1">취소</a>
                            <button type="submit" class="btn btn-type1 color-type5">확인</button>
                        </div>

                    </fieldset>
                </form>
            </div>
            <a href="#n" class="btn btn-popup-close"><span class="hide">팝업 닫기</span></a>
        </div>
    </div>

</html>
